// Source: src/mipi_csi_lib/mipi_csi_lib.h  (class MipiCsi : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.mipi_csi;

import "common.proto";

// Config for the mipi_csi module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testMipiCsiPresent
//   testMipiCsiLaneCount
//   testMipiCsiPixelFormat
//   testMipiCsiFrameRate
//   testMipiCsiDataIntegrity
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single mipi_csi test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
