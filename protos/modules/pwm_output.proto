// Source: src/pwm_output_lib/pwm_output_lib.h  (class PwmOutput : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.pwm_output;

import "common.proto";

// Config for the pwm_output module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testPwmChipPresent
//   testPwmExportChannel
//   testPwmFrequency
//   testPwmDutyCycle
//   testPwmPolarity
//   testPwmRange
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single pwm_output test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
