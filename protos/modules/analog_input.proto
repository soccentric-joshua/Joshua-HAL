// Source: src/analog_input_lib/analog_input_lib.h  (class AnalogInput : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.analog_input;

import "common.proto";

// Config for the analog_input module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testAdcChannelPresent
//   testAdcReadRaw
//   testAdcLinearity
//   testAdcResolution
//   testAdcNoise
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single analog_input test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
