// Source: src/battery_lib/battery_lib.h  (class Battery : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.battery;

import "common.proto";

// Config for the battery module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testBatteryPresent
//   testBatteryVoltage
//   testBatteryCurrent
//   testBatteryCapacity
//   testBatteryHealth
//   testBatteryTemperature
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single battery test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
