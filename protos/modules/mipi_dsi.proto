// Source: src/mipi_dsi_lib/mipi_dsi_lib.h  (class MipiDsi : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.mipi_dsi;

import "common.proto";

// Config for the mipi_dsi module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testMipiDsiPresent
//   testMipiDsiPanel
//   testMipiDsiResolution
//   testMipiDsiBacklight
//   testMipiDsiCommandMode
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single mipi_dsi test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
