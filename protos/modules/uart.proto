// Source: src/uart_lib/uart_lib.h  (class Uart : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.uart;

import "common.proto";

// Config for the uart module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testUartDevicePresent
//   testUartBaudRate
//   testUartLoopback
//   testUartDataIntegrity
//   testUartFlowControl
//   testUartErrorHandling
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single uart test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
