// Source: src/accelerometer_lib/accelerometer_lib.h  (class Accelerometer : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.accelerometer;

import "common.proto";

// Config for the accelerometer module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order):
//   testAccelerometerPresent
//   testAccelerometerReadAxes
//   testAccelerometerRange
//   testAccelerometerScale
//   testAccelerometerSensitivity
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single accelerometer test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
