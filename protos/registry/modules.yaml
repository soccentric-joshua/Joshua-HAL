# protos/registry/modules.yaml
#
# Machine-readable manifest of every HAL module exposed over the proto layer.
#
# Fields:
# id - wire identifier (unique, permanent; never reused)
# source_path - repo-relative path to the C++ header implementing this module
# proto_package / config_type / result_type - proto contract
# version - integer; increment when the proto contract changes
# status - "active" | "deprecated"
# category - functional grouping
# modes - supported execution modes
#
# Adding a module: append an entry here and create protos/modules/<id>.proto and
# src/<id>_lib/<id>_lib.{h,cpp}. No other file needs to change.
modules:
- id: audio_interfaces
  name: Audio Interfaces
  description: Audio interface testing
  proto_package: hal.modules.audio_interfaces
  config_type: hal.modules.audio_interfaces.Config
  result_type: hal.modules.audio_interfaces.Result
  version: 1
  status: active
  category: peripherals
  source_path: src/audio_interfaces/audio_interfaces.h
  modes:
  - SINGLE_SHOT
  - LONG_TERM
